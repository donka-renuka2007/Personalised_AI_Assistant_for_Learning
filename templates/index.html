<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      padding-top: 100px;
      padding-bottom: 40px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1e293b;
    }
    .main-header {
      text-align: center;
      color: white;
      background-color: #2563eb;
      height: 80px;
      top: 0;
      left: 0;
      right: 0;
      position: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
      z-index: 1000;
    }
    .main-title {
      font-size: 24px;
      font-weight: 700;
    }
    .tagline {
      font-size: 16px;
      text-align: center;
      color: #64748b;
      margin: 20px auto 30px auto;
      max-width: 800px;
      padding: 0 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      padding: 0 20px;
    }
    .card-link {
      text-decoration: none;
      color: inherit;
    }
    .card {
      display: flex;
      flex-direction: column;
      height: 220px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #2563eb;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.15);
    }
    .card-icon {
      height: 80px;
      width: 80px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .card-desc {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="main-header">
    <h1 class="main-title">Personalised AI Assistant for Learning</h1>
  </div>

  <p class="tagline">Your journey to better solutions starts here. Explore our features and discover how we can help you grow.</p>

  <div class="container">
    <a href="{{ url_for('chat_bot') }}" class="card-link">
      <div class="card">
        <img class="card-icon" src="{{ url_for('static', filename='icon_image.png') }}" alt="AI Assistant">
        <p class="card-desc">Chat with AI Assistant</p>
      </div>
    </a>

    <a href="{{ url_for('book_library') }}" class="card-link">
      <div class="card">
        <img class="card-icon" src="../static/library_book.jpg" alt="Library">
        <p class="card-desc">Get Books</p>
      </div>
    </a>

    <a href="{{ url_for('upload_pdf_quiz') }}" class="card-link">
      <div class="card">
        <img class="card-icon" src="{{ url_for('static', filename='quiz_image.webp') }}" alt="Quiz">
        <p class="card-desc">Upload PDF ➡️ Get Quiz</p>
      </div>
    </a>

    <a href="{{ url_for('show_progress') }}" class="card-link">
      <div class="card">
        <img class="card-icon" src="{{ url_for('static', filename='progress_image.webp') }}" alt="Progress">
        <p class="card-desc">See Your Progress 🎉</p>
      </div>
    </a>
  </div>

</body>
</html>
