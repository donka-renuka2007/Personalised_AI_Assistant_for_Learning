<!DOCTYPE html>
<html>
<head>
    <title>Quiz Results</title>
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 50px;">

    <h1>Quiz Results</h1>
    <h2 style="color: #00f0ff;">Score: {{ score }} / {{ total }}</h2>
    
    <p style="font-size: 18px; margin-top: 20px;">{{ feedback }}</p>

    <!-- Return to main chat page -->
    <a href="{{ url_for('chat_bot') }}" 
       style="display: inline-block; margin-top: 25px; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 6px;">
       Back to Chat
    </a>

</body>
</html>
