<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF for Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='agent_chatbot.css') }}">
    <style>
        body {
            background-color:#885CE6;
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .upload-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00f0ff;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .file-input-wrapper {
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #00f0ff;
            display: block;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            color: #e2e8f0;
            transition: background 0.3s ease;
        }
        .custom-file-upload:hover {
            background: rgba(0, 240, 255, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00f0ff;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #00c8d6;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover {
            color: #00f0ff;
        }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>📄 Upload PDF for Quiz</h2>
    <p>Upload any study document (PDF), and AI will analyze it using RAG to generate a 10-question quiz!</p>

    <form action="{{ url_for('upload_pdf_quiz') }}" method="POST" enctype="multipart/form-data">
        <div class="file-input-wrapper">
            <label for="pdf_file" class="custom-file-upload" id="file-label">
                📌 Click to select a PDF file
            </label>
            <input type="file" name="pdf_file" id="pdf_file" accept=".pdf" required onchange="updateFileName()">
        </div>

        <button type="submit">Generate Quiz ✨</button>
    </form>

    <a href="{{ url_for('home') }}" class="btn-back">← Back to Dashboard</a>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('pdf_file');
        const label = document.getElementById('file-label');
        if (input.files.length > 0) {
            label.innerText = '📄 ' + input.files[0].name;
        }
    }
</script>

</body>
</html>
